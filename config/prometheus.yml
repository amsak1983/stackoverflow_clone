global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    
  # Sidekiq metrics (sidekiq accessory container)
  - job_name: 'sidekiq'
    static_configs:
      - targets: ['stackoverflow_clone-sidekiq:9394']
        labels:
          service: 'stackoverflow_clone'
          role: 'sidekiq'
          environment: 'production'
  
  # Rails web metrics (web container - using IP address)
  # Note: IP address may change after redeployment, update manually if needed
  - job_name: 'rails'
    static_configs:
      - targets: ['172.18.0.10:9394']
        labels:
          service: 'stackoverflow_clone'
          role: 'web'
          environment: 'production'
