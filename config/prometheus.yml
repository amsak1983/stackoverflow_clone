global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Rails application metrics
  - job_name: 'rails'
    static_configs:
      - targets: ['host.docker.internal:9394']
        labels:
          service: 'stackoverflow_clone'
          environment: 'production'
    
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Sidekiq metrics (через prometheus_exporter)
  - job_name: 'sidekiq'
    static_configs:
      - targets: ['host.docker.internal:9394']
        labels:
          service: 'stackoverflow_clone_sidekiq'
          environment: 'production'
