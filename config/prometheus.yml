global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
    
  # Sidekiq metrics (sidekiq accessory container)
  - job_name: 'sidekiq'
    static_configs:
      - targets: ['stackoverflow_clone-sidekiq:9394']
        labels:
          service: 'stackoverflow_clone'
          role: 'sidekiq'
          environment: 'production'
  
  # Rails web metrics (web container - using container name)
  # Container name remains stable across redeployments
  - job_name: 'rails'
    static_configs:
      - targets: ['stackoverflow_clone-web:9394']
        labels:
          service: 'stackoverflow_clone'
          role: 'web'
          environment: 'production'
