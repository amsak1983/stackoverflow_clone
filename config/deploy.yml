service: stackoverflow_clone

image: amsak701/stclone

servers:
  web:
    - 90.156.228.95

registry:
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

env:
  secret:
    - SECRET_KEY_BASE
    - GOOGLE_CLIENT_ID
    - GOOGLE_CLIENT_SECRET
    - SIDEKIQ_USERNAME
    - SIDEKIQ_PASSWORD
    - SMTP_ADDRESS
    - SMTP_USERNAME
    - SMTP_PASSWORD
 
  clear:
    RAILS_ENV: production
    RAILS_LOG_TO_STDOUT: "1"
    RAILS_SERVE_STATIC_FILES: "true"
    WEB_CONCURRENCY: "2"
    RAILS_MAX_THREADS: "5"
    REDIS_URL: redis://redis:6379/0
    ELASTICSEARCH_URL: http://elasticsearch:9200
    APP_HOST: "90.156.228.95"
    MAILER_FROM_EMAIL: "noreply@stackoverflow-clone.com"
    SMTP_PORT: "587"
    SMTP_DOMAIN: "90.156.228.95"

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"

volumes:
  - "stackoverflow_clone_storage:/rails/storage"
  - "stackoverflow_clone_log:/rails/log"
  - "stackoverflow_clone_tmp:/rails/tmp"

asset_path: /rails/public/assets

builder:
  remote: 90.156.228.95
  arch: amd64

# Traefik reverse proxy with SSL
proxy:
  # ssl: true
  host: 90.156.228.95
  # Automatic SSL certificates via Let's Encrypt
  # Note: Let's Encrypt requires a domain name, not IP
  # For IP-only access, you'll need to manually configure SSL certificates
  # acme:
  #   email: your-email@example.com

accessories:
  redis:
    image: redis:7-alpine
    host: 90.156.228.95
    port: "127.0.0.1:6379:6379"
    directories:
      - redis-data:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    host: 90.156.228.95
    port: "127.0.0.1:9200:9200"
    env:
      clear:
        discovery.type: single-node
        xpack.security.enabled: "false"
        ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    directories:
      - es-data:/usr/share/elasticsearch/data

  sidekiq:
    image: amsak701/stclone
    host: 90.156.228.95
    cmd: bundle exec sidekiq -C config/sidekiq.yml
    env:
      secret:
        - SECRET_KEY_BASE
        - SMTP_ADDRESS
        - SMTP_USERNAME
        - SMTP_PASSWORD
      clear:
        RAILS_ENV: production
        REDIS_URL: redis://redis:6379/0
        ELASTICSEARCH_URL: http://elasticsearch:9200
        APP_HOST: "90.156.228.95"
        MAILER_FROM_EMAIL: "noreply@stackoverflow-clone.com"
        SMTP_PORT: "587"
        SMTP_DOMAIN: "90.156.228.95"

